<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang - Kopi Prima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/products.js"></script>
  </head>
  <body class="bg-coffee-50">
    <header class="sticky top-0 z-50 border-b border-coffee-100 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
        <a href="index.html" class="text-xl font-bold text-coffee-700">☕ KOPI PRIMA</a>
        <nav class="flex gap-3">
          <a href="products.html" class="text-sm font-medium hover:text-coffee-600">Produk</a>
          <a href="cart.html" class="text-sm font-medium text-coffee-600">Cart</a>
          <button id="logoutBtn" class="hidden rounded-full px-4 py-2 bg-red-500 text-white text-sm">Logout</button>
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-10">
      <h1 class="mb-8 text-3xl font-bold text-coffee-700">Keranjang Belanja</h1>
      <div id="cartContainer" class="grid gap-8 md:grid-cols-3">
        <div class="md:col-span-2 space-y-4">
          <div id="cartItems" class="space-y-3">
            <p class="text-center py-10 text-stone-500">Keranjang kosong</p>
          </div>
        </div>
        <div class="rounded-2xl border border-coffee-100 bg-white p-6 h-fit">
          <h2 class="mb-4 text-lg font-bold text-coffee-700">Ringkasan</h2>
          <div class="space-y-3 border-t border-coffee-100 pt-4">
            <div class="flex justify-between">
              <span>Subtotal</span>
              <span id="subtotal">Rp 0</span>
            </div>
            <div class="flex justify-between">
              <span>Ongkir</span>
              <span id="shipping">Rp 0</span>
            </div>
            <div class="border-t pt-3 flex justify-between font-bold text-lg">
              <span>Total</span>
              <span id="total">Rp 0</span>
            </div>
            <form id="checkoutForm" class="mt-6 space-y-3">
              <input id="shippingAddress" class="w-full rounded-xl border px-4 py-2 text-sm" placeholder="Alamat pengiriman" />
              <select id="paymentMethod" class="w-full rounded-xl border px-4 py-2 text-sm">
                <option>Transfer Bank</option>
                <option>E-Wallet</option>
                <option>COD</option>
              </select>
              <button type="submit" class="w-full rounded-xl bg-coffee-600 px-4 py-3 font-semibold text-white">Checkout</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <div id="notificationContainer" class="fixed top-5 right-5 z-50"></div>
    <script>
      document.getElementById('logoutBtn').addEventListener('click', async () => { await auth.logout(); location.href = 'index.html'; });
      document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = auth.getCurrentUser();
        if (!user) return alert('Silakan login dulu');
        const addr = document.getElementById('shippingAddress').value.trim();
        const method = document.getElementById('paymentMethod').value;
        if (!addr) return alert('Alamat wajib diisi');
        try {
          const res = await fetch(`${window.API_BASE}/cart/checkout`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-User-ID': user.id },
            body: JSON.stringify({ shipping_address: addr, payment_method: method })
          });
          const data = await res.json();
          if (data.status === 'success') { alert('Checkout berhasil!'); location.href = 'index.html'; }
          else alert(data.message || 'Checkout gagal');
        } catch (e) { alert('Error: ' + e.message); }
      });
    </script>
  </body>
</html>
