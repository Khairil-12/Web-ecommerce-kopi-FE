<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Kopi Prima</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body>
    <main class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card card-shadow p-5">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 mb-0">Daftar Akun</h1>
                <a href="index.html">Kembali</a>
              </div>
              <form id="registerForm" class="row g-3">
                <div class="col-md-6"><input id="username" class="form-control" placeholder="Username" required /></div>
                <div class="col-md-6"><input id="email" type="email" class="form-control" placeholder="Email" required /></div>
                <div class="col-md-6"><input id="phone" class="form-control" placeholder="Nomor telepon" required /></div>
                <div class="col-md-6"><input id="password" type="password" class="form-control" placeholder="Password" required /></div>
                <div class="col-12"><input id="confirmPassword" type="password" class="form-control" placeholder="Konfirmasi password" required /></div>
                <div class="col-12"><button class="btn btn-primary w-100">Daftar</button></div>
                <div class="col-12"><p id="errorMessage" class="d-none alert alert-danger mb-0"></p></div>
                <div class="col-12"><p id="successMessage" class="d-none alert alert-success mb-0"></p></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>
      const auth = window.authSystem;
      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        if (password !== confirmPassword) { errorMessage.textContent = 'Password tidak cocok'; errorMessage.classList.remove('d-none'); return; }
        const res = await auth.register({ username: document.getElementById('username').value.trim(), email: document.getElementById('email').value.trim(), phone: document.getElementById('phone').value.trim(), password });
        const ok = res && (res.success === true || res.status === 'success');
        if (ok) { successMessage.textContent = res.message || 'Berhasil'; successMessage.classList.remove('d-none'); }
        else { errorMessage.textContent = res.message || 'Gagal'; errorMessage.classList.remove('d-none'); }
      });
    </script>
  </body>
</html>
