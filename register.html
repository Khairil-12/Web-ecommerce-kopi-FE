<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register - Kopi Prima" />
    <title>Register - Kopi Prima</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #faf8f3 0%, #f5f1e8 100%);
        padding: 20px;
      }

      .auth-container {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(139, 69, 19, 0.06);
        overflow: hidden;
      }

      .auth-header {
        padding: 50px 30px 30px;
        text-align: center;
        background: linear-gradient(135deg, #faf8f3 0%, #f5f1e8 100%);
        border-bottom: 1px solid rgba(139, 69, 19, 0.05);
      }

      .auth-logo {
        font-size: 3.5rem;
        margin-bottom: 15px;
        display: inline-block;
      }

      .auth-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: #7a6b61;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }

      .auth-subtitle {
        font-size: 0.9rem;
        color: #a89f94;
        margin-bottom: 0;
      }

      .auth-body {
        padding: 40px 30px;
        max-height: 600px;
        overflow-y: auto;
      }

      .auth-body::-webkit-scrollbar {
        width: 6px;
      }

      .auth-body::-webkit-scrollbar-track {
        background: #faf8f3;
      }

      .auth-body::-webkit-scrollbar-thumb {
        background: #c9bfb2;
        border-radius: 3px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #7a6b61;
        margin-bottom: 8px;
        display: block;
      }

      .form-control {
        background: #faf8f3;
        border: 1px solid rgba(139, 69, 19, 0.08);
        border-radius: 12px;
        padding: 11px 15px;
        font-size: 0.95rem;
        color: #7a6b61;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        background: white;
        border-color: rgba(139, 69, 19, 0.2);
        box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.04);
        color: #7a6b61;
      }

      .form-control::placeholder {
        color: #c9bfb2;
      }

      .btn-auth {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        background: linear-gradient(135deg, #9d8b7e 0%, #8b7f74 100%);
        color: white;
        transition: all 0.3s ease;
        margin-bottom: 15px;
        cursor: pointer;
        margin-top: 10px;
      }

      .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(139, 69, 19, 0.12);
        color: white;
        text-decoration: none;
      }

      .btn-auth:active {
        transform: translateY(0);
      }

      .auth-toggle {
        text-align: center;
        padding-top: 15px;
        border-top: 1px solid rgba(139, 69, 19, 0.05);
      }

      .auth-toggle-text {
        font-size: 0.9rem;
        color: #a89f94;
        margin-bottom: 0;
      }

      .auth-toggle-link {
        font-weight: 600;
        color: #8b7f74;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .auth-toggle-link:hover {
        color: #7a6b61;
      }

      .password-hint {
        font-size: 0.8rem;
        color: #c9bfb2;
        margin-top: 5px;
      }

      @media (max-width: 480px) {
        .auth-container {
          max-width: 100%;
        }

        .auth-header {
          padding: 40px 20px 25px;
        }

        .auth-body {
          padding: 30px 20px;
        }

        .auth-logo {
          font-size: 3rem;
          margin-bottom: 12px;
        }

        .auth-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-container animate-fade-up">
        <div class="auth-header">
          <div class="auth-logo">☕</div>
          <h1 class="auth-title">Kopi Prima</h1>
          <p class="auth-subtitle">Buat akun baru Anda</p>
        </div>

        <div class="auth-body">
          <form id="registerForm">
            <div class="form-group">
              <label class="form-label" for="regUsername">Username</label>
              <input
                type="text"
                class="form-control"
                id="regUsername"
                placeholder="Pilih username unik"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="regEmail">Email</label>
              <input
                type="email"
                class="form-control"
                id="regEmail"
                placeholder="email@contoh.com"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="regPhone">Nomor Telepon</label>
              <input
                type="tel"
                class="form-control"
                id="regPhone"
                placeholder="08xx-xxxx-xxxx"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="regPassword">Kata Sandi</label>
              <input
                type="password"
                class="form-control"
                id="regPassword"
                placeholder="Minimal 6 karakter"
                required
              />
              <div class="password-hint">Gunakan kombinasi huruf dan angka</div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regConfirmPassword"
                >Konfirmasi Kata Sandi</label
              >
              <input
                type="password"
                class="form-control"
                id="regConfirmPassword"
                placeholder="Ketik ulang kata sandi"
                required
              />
            </div>

            <button type="submit" class="btn-auth">Daftar</button>

            <div class="auth-toggle">
              <p class="auth-toggle-text">
                Sudah punya akun?
                <a href="login.html" class="auth-toggle-link">Masuk di sini</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
    <script>
      const auth = window.authSystem;

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const username = document.getElementById("regUsername").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const phone = document.getElementById("regPhone").value.trim();
          const password = document.getElementById("regPassword").value;
          const confirmPassword =
            document.getElementById("regConfirmPassword").value;

          // Validate passwords match
          if (password !== confirmPassword) {
            alert("Kata sandi tidak cocok");
            return;
          }

          // Validate password length
          if (password.length < 6) {
            alert("Kata sandi minimal 6 karakter");
            return;
          }

          const res = await auth.register({
            username,
            email,
            phone,
            password,
          });

          const ok = res && (res.success === true || res.status === "success");
          if (ok) {
            alert(res.message || "Pendaftaran berhasil! Silakan login.");
            location.href = "login.html";
          } else {
            alert(res?.message || "Pendaftaran gagal. Silakan coba lagi.");
          }
        });
    </script>
  </body>
</html>
