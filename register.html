<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Kopi Prima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-coffee-700 to-coffee-500">
    <main class="mx-auto flex min-h-screen max-w-6xl items-center px-4 py-10">
      <section class="w-full rounded-3xl bg-white p-10 shadow-2xl">
        <div class="mb-8 flex items-center justify-between">
          <h1 class="text-3xl font-bold text-coffee-700">Daftar Akun</h1>
          <a class="text-sm font-semibold text-coffee-600" href="index.html">Kembali</a>
        </div>
        <form id="registerForm" class="grid gap-4 md:grid-cols-2">
          <input id="username" class="rounded-xl border px-4 py-3" placeholder="Username" required />
          <input id="email" type="email" class="rounded-xl border px-4 py-3" placeholder="Email" required />
          <input id="phone" class="rounded-xl border px-4 py-3" placeholder="Nomor telepon" required />
          <input id="password" type="password" class="rounded-xl border px-4 py-3" placeholder="Password" required />
          <input id="confirmPassword" type="password" class="rounded-xl border px-4 py-3 md:col-span-2" placeholder="Konfirmasi password" required />
          <button class="rounded-xl bg-coffee-600 px-4 py-3 font-semibold text-white md:col-span-2">Daftar</button>
          <p id="errorMessage" class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700 md:col-span-2"></p>
          <p id="successMessage" class="hidden rounded-xl bg-green-50 px-4 py-3 text-sm text-green-700 md:col-span-2"></p>
        </form>
      </section>
    </main>
    <script>
      const auth = window.authSystem;
      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (password !== confirmPassword) return (document.getElementById('errorMessage').classList.remove('hidden'), document.getElementById('errorMessage').textContent = 'Password tidak cocok');
        const res = await auth.register({ username: username.value.trim(), email: email.value.trim(), phone: phone.value.trim(), password });
        const ok = res && (res.success === true || res.status === 'success');
        if (ok) { successMessage.textContent = res.message || 'Berhasil'; successMessage.classList.remove('hidden'); }
        else { errorMessage.textContent = res.message || 'Gagal'; errorMessage.classList.remove('hidden'); }
      });
    </script>
  </body>
</html>
