<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin - Kopi Prima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body class="bg-gray-100">
    <header class="sticky top-0 z-50 border-b bg-white shadow">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
        <h1 class="text-xl font-bold text-coffee-700">☕ ADMIN DASHBOARD</h1>
        <div class="flex gap-3">
          <a href="index.html" class="text-sm font-medium">Kembali</a>
          <button id="logoutBtn" class="rounded px-3 py-2 bg-red-500 text-white text-sm">Logout</button>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8">
      <div class="grid gap-4 md:grid-cols-4 mb-8">
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Total Users</p>
          <p id="statUsers" class="mt-2 text-3xl font-bold">-</p>
        </div>
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Total Products</p>
          <p id="statProducts" class="mt-2 text-3xl font-bold">-</p>
        </div>
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Total Transactions</p>
          <p id="statTransactions" class="mt-2 text-3xl font-bold">-</p>
        </div>
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Total Revenue</p>
          <p id="statRevenue" class="mt-2 text-3xl font-bold">Rp 0</p>
        </div>
      </div>
      <section class="rounded-lg bg-white p-6 shadow">
        <h2 class="mb-4 text-lg font-bold">👥 Users</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="border-b">
              <tr class="text-left">
                <th class="px-4 py-2">ID</th>
                <th class="px-4 py-2">Username</th>
                <th class="px-4 py-2">Email</th>
                <th class="px-4 py-2">Phone</th>
                <th class="px-4 py-2">Role</th>
              </tr>
            </thead>
            <tbody id="usersTable" class="divide-y">
              <tr><td class="px-4 py-2 text-center" colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="mt-8 rounded-lg bg-white p-6 shadow">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-lg font-bold">📦 Products</h2>
          <button id="addProductBtn" class="rounded px-3 py-2 bg-coffee-600 text-white text-sm">+ Add</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="border-b">
              <tr class="text-left">
                <th class="px-4 py-2">ID</th>
                <th class="px-4 py-2">Name</th>
                <th class="px-4 py-2">Price</th>
                <th class="px-4 py-2">Stock</th>
                <th class="px-4 py-2">Status</th>
              </tr>
            </thead>
            <tbody id="productsTable" class="divide-y">
              <tr><td class="px-4 py-2 text-center" colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="mt-8 rounded-lg bg-white p-6 shadow">
        <h2 class="mb-4 text-lg font-bold">💰 Transactions</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="border-b">
              <tr class="text-left">
                <th class="px-4 py-2">Code</th>
                <th class="px-4 py-2">User</th>
                <th class="px-4 py-2">Total</th>
                <th class="px-4 py-2">Status</th>
                <th class="px-4 py-2">Date</th>
              </tr>
            </thead>
            <tbody id="transactionsTable" class="divide-y">
              <tr><td class="px-4 py-2 text-center" colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const user = auth.getCurrentUser();
      if (!user || !user.is_admin) location.href = 'index.html';
      document.getElementById('logoutBtn').addEventListener('click', async () => { await auth.logout(); location.href = 'index.html'; });
      (async () => {
        try {
          const res = await fetch(`${window.API_BASE}/admin/dashboard`, { headers: { 'X-User-ID': user.id } });
          const data = await res.json();
          if (data.status === 'success') {
            const s = data.data;
            document.getElementById('statUsers').textContent = s.total_users || 0;
            document.getElementById('statProducts').textContent = s.total_products || 0;
            document.getElementById('statTransactions').textContent = s.total_transactions || 0;
            document.getElementById('statRevenue').textContent = 'Rp ' + (s.total_revenue || 0).toLocaleString('id-ID');
          }
        } catch (e) { console.error(e); }
      })();
    </script>
  </body>
</html>
