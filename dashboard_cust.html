<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Pelanggan - Kopi Prima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body class="bg-gray-100">
    <header class="sticky top-0 z-50 border-b bg-white shadow">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
        <h1 class="text-xl font-bold text-coffee-700">☕ MY DASHBOARD</h1>
        <div class="flex gap-3">
          <a href="products.html" class="text-sm font-medium">Belanja</a>
          <a href="cart.html" class="text-sm font-medium">Cart</a>
          <button id="logoutBtn" class="rounded px-3 py-2 bg-red-500 text-white text-sm">Logout</button>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8">
      <div id="profileSection" class="mb-8 rounded-lg bg-white p-8 shadow">
        <div class="flex items-center gap-6">
          <div id="avatar" class="h-24 w-24 flex items-center justify-center rounded-full bg-coffee-600 text-3xl font-bold text-white">K</div>
          <div>
            <h1 id="userName" class="text-2xl font-bold">-</h1>
            <p id="userEmail" class="text-gray-600">-</p>
          </div>
        </div>
      </div>
      <div class="grid gap-4 md:grid-cols-3 mb-8">
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Total Orders</p>
          <p id="totalOrders" class="mt-2 text-3xl font-bold">0</p>
        </div>
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Total Spent</p>
          <p id="totalSpent" class="mt-2 text-3xl font-bold">Rp 0</p>
        </div>
        <div class="rounded-lg bg-white p-6 shadow">
          <p class="text-sm text-gray-600">Cart Items</p>
          <p id="cartItems" class="mt-2 text-3xl font-bold">0</p>
        </div>
      </div>
      <section class="rounded-lg bg-white p-6 shadow">
        <h2 class="mb-4 text-lg font-bold">📋 Recent Orders</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="border-b">
              <tr class="text-left">
                <th class="px-4 py-2">Code</th>
                <th class="px-4 py-2">Amount</th>
                <th class="px-4 py-2">Status</th>
                <th class="px-4 py-2">Date</th>
              </tr>
            </thead>
            <tbody id="ordersTable" class="divide-y">
              <tr><td class="px-4 py-2 text-center" colspan="4">No orders yet</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const user = auth.getCurrentUser();
      if (!user) location.href = 'login.html';
      if (user.is_admin) location.href = 'dashboard_admin.html';
      document.getElementById('userName').textContent = user.username || '-';
      document.getElementById('userEmail').textContent = user.email || '-';
      document.getElementById('avatar').textContent = (user.username || 'K')[0].toUpperCase();
      document.getElementById('logoutBtn').addEventListener('click', async () => { await auth.logout(); location.href = 'index.html'; });
      (async () => {
        try {
          const res = await fetch(`${window.API_BASE}/customer/dashboard`, { headers: { 'X-User-ID': user.id } });
          const data = await res.json();
          if (data.status === 'success') {
            const d = data.data;
            document.getElementById('totalOrders').textContent = d.total_orders || 0;
            document.getElementById('totalSpent').textContent = 'Rp ' + (d.total_spent || 0).toLocaleString('id-ID');
            document.getElementById('cartItems').textContent = d.cart?.item_count || 0;
            const tbody = document.getElementById('ordersTable');
            if (d.recent_transactions?.length) {
              tbody.innerHTML = d.recent_transactions.map(t => `<tr class="border-b"><td class="px-4 py-2">${t.transaction_code}</td><td class="px-4 py-2">Rp ${(t.total_amount || 0).toLocaleString('id-ID')}</td><td class="px-4 py-2"><span class="inline-flex rounded px-2 py-1 text-xs font-semibold ${t.status === 'completed' ? 'bg-green-100 text-green-800' : t.status === 'pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100'}">${t.status}</span></td><td class="px-4 py-2">${new Date(t.created_at).toLocaleDateString('id-ID')}</td></tr>`).join('');
            }
          }
        } catch (e) { console.error(e); }
      })();
    </script>
  </body>
</html>
