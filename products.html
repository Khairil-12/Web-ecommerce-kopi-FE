<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produk - Kopi Prima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/products.js"></script>
    <script defer src="js/products-app.js"></script>
  </head>
  <body class="bg-coffee-50">
    <header class="sticky top-0 z-50 border-b border-coffee-100 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
        <a href="index.html" class="text-xl font-bold text-coffee-700">☕ KOPI PRIMA</a>
        <nav class="flex gap-3 text-sm font-medium">
          <a class="rounded-full px-4 py-2 hover:bg-coffee-500 hover:text-white" href="index.html">Beranda</a>
          <a class="rounded-full px-4 py-2 bg-coffee-500 text-white" href="products.html">Produk</a>
          <a class="rounded-full px-4 py-2 hover:bg-coffee-500 hover:text-white" href="cart.html">Cart (<span id="cartCount">0</span>)</a>
          <a id="dashboardLink" class="rounded-full px-4 py-2 hover:bg-coffee-500 hover:text-white hidden" href="#">Dashboard</a>
          <button id="loginBtn" class="rounded-full px-4 py-2 hover:bg-coffee-500 hover:text-white">Login</button>
          <button id="logoutBtn" class="hidden rounded-full px-4 py-2 bg-red-500 text-white">Logout</button>
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-10">
      <h1 class="mb-8 text-3xl font-bold text-coffee-700">Produk Kopi Premium</h1>
      <div class="mb-6 grid gap-4 md:grid-cols-4">
        <select id="sortSelect" class="rounded-xl border px-4 py-2">
          <option value="default">Urutkan</option>
          <option value="price-low">Harga Terendah</option>
          <option value="price-high">Harga Tertinggi</option>
          <option value="name-asc">Nama A-Z</option>
          <option value="name-desc">Nama Z-A</option>
        </select>
        <input id="searchInput" class="rounded-xl border px-4 py-2" placeholder="Cari produk..." />
        <button id="resetFiltersBtn" class="rounded-xl bg-coffee-600 px-4 py-2 text-white">Reset</button>
      </div>
      <div id="productsContainer" class="grid gap-6 md:grid-cols-3 lg:grid-cols-4">
        <div class="col-span-full text-center py-10 text-stone-500">Loading...</div>
      </div>
    </main>
    <div id="notificationContainer" class="fixed top-5 right-5 z-50"></div>
    <script>
      document.getElementById('loginBtn').addEventListener('click', () => location.href = 'login.html');
      document.getElementById('logoutBtn').addEventListener('click', async () => { await auth.logout(); location.reload(); });
    </script>
  </body>
</html>
