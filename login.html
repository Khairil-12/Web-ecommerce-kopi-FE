<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login - Kopi Prima" />
    <title>Login - Kopi Prima</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #faf8f3 0%, #f5f1e8 100%);
        padding: 20px;
      }

      .auth-container {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(139, 69, 19, 0.06);
        overflow: hidden;
      }

      .auth-header {
        padding: 50px 30px 30px;
        text-align: center;
        background: linear-gradient(135deg, #faf8f3 0%, #f5f1e8 100%);
        border-bottom: 1px solid rgba(139, 69, 19, 0.05);
      }

      .auth-logo {
        font-size: 3.5rem;
        margin-bottom: 15px;
        display: inline-block;
      }

      .auth-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: #7a6b61;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }

      .auth-subtitle {
        font-size: 0.9rem;
        color: #a89f94;
        margin-bottom: 0;
      }

      .auth-body {
        padding: 40px 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #7a6b61;
        margin-bottom: 8px;
        display: block;
      }

      .form-control {
        background: #faf8f3;
        border: 1px solid rgba(139, 69, 19, 0.08);
        border-radius: 12px;
        padding: 11px 15px;
        font-size: 0.95rem;
        color: #7a6b61;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        background: white;
        border-color: rgba(139, 69, 19, 0.2);
        box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.04);
        color: #7a6b61;
      }

      .form-control::placeholder {
        color: #c9bfb2;
      }

      .btn-auth {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        background: linear-gradient(135deg, #9d8b7e 0%, #8b7f74 100%);
        color: white;
        transition: all 0.3s ease;
        margin-bottom: 15px;
        cursor: pointer;
      }

      .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(139, 69, 19, 0.12);
        color: white;
        text-decoration: none;
      }

      .btn-auth:active {
        transform: translateY(0);
      }

      .auth-toggle {
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid rgba(139, 69, 19, 0.05);
      }

      .auth-toggle-text {
        font-size: 0.9rem;
        color: #a89f94;
        margin-bottom: 0;
      }

      .auth-toggle-link {
        font-weight: 600;
        color: #8b7f74;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .auth-toggle-link:hover {
        color: #7a6b61;
      }

      .form-check {
        margin-bottom: 20px;
      }

      .form-check-input {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(139, 69, 19, 0.15);
        border-radius: 4px;
        cursor: pointer;
        accent-color: #9d8b7e;
      }

      .form-check-label {
        font-size: 0.9rem;
        color: #a89f94;
        cursor: pointer;
        margin-left: 8px;
        margin-bottom: 0;
      }

      @media (max-width: 480px) {
        .auth-container {
          max-width: 100%;
        }

        .auth-header {
          padding: 40px 20px 25px;
        }

        .auth-body {
          padding: 30px 20px;
        }

        .auth-logo {
          font-size: 3rem;
          margin-bottom: 12px;
        }

        .auth-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-container animate-fade-up">
        <div class="auth-header">
          <div class="auth-logo">☕</div>
          <h1 class="auth-title">Kopi Prima</h1>
          <p class="auth-subtitle">Masuk ke akun Anda</p>
        </div>

        <div class="auth-body">
          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="loginEmail"
                >Email atau Username</label
              >
              <input
                type="text"
                class="form-control"
                id="loginEmail"
                placeholder="nama@email.com"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Kata Sandi</label>
              <input
                type="password"
                class="form-control"
                id="loginPassword"
                placeholder="Masukkan kata sandi"
                required
              />
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">
                Ingat saya
              </label>
            </div>

            <button type="submit" class="btn-auth">Masuk</button>

            <div class="auth-toggle">
              <p class="auth-toggle-text">
                Belum punya akun?
                <a href="register.html" class="auth-toggle-link"
                  >Daftar di sini</a
                >
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
    <script>
      const auth = window.authSystem;

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;
          const res = await auth.login(email, password);

          if (res.success) {
            location.href = "index.html";
          } else {
            alert(res.message || "Login gagal");
          }
        });
    </script>
  </body>
</html>
