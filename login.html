<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Kopi Prima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-coffee-700 to-coffee-500">
    <main class="mx-auto flex min-h-screen max-w-6xl items-center px-4 py-10">
      <section class="grid w-full overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2">
        <div class="bg-coffee-700 p-10 text-white">
          <h1 class="text-3xl font-bold">Kopi Prima</h1>
          <p class="mt-4 text-coffee-50">Masuk ke dashboard, cart, dan order dengan tema kopi yang tetap rapi.</p>
        </div>
        <div class="p-10">
          <div class="mb-8 flex gap-3 text-sm font-semibold">
            <a class="text-coffee-700" href="index.html">Kembali</a>
            <a class="text-coffee-500" href="register.html">Daftar</a>
          </div>
          <form id="loginForm" class="space-y-4">
            <div>
              <label class="mb-2 block text-sm font-medium">Username / Email</label>
              <input id="username" class="w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-coffee-500" required />
            </div>
            <div>
              <label class="mb-2 block text-sm font-medium">Password</label>
              <input id="password" type="password" class="w-full rounded-xl border border-stone-200 px-4 py-3 outline-none focus:border-coffee-500" required />
            </div>
            <button class="w-full rounded-xl bg-coffee-600 px-4 py-3 font-semibold text-white">Login</button>
            <p id="errorMessage" class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
          </form>
        </div>
      </section>
    </main>
    <script>
      const auth = window.authSystem;
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await auth.login(document.getElementById('username').value.trim(), document.getElementById('password').value);
        if (res.success) location.href = 'index.html';
        else { const el = document.getElementById('errorMessage'); el.textContent = res.message || 'Login gagal'; el.classList.remove('hidden'); }
      });
    </script>
  </body>
</html>
